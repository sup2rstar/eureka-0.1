<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eureka - Login/Sign Up</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

    <header class="main-header">
        <nav>
            <button class="nav-button log-in" onclick="location.href='login-signup.html'">LOG IN</button>
            <button class="nav-button sign-up" onclick="location.href='login-signup.html'">SIGN UP</button>
        </nav>
    </header>

    <main class="form-container">
        <h1>Welcome!</h1>
        <p>Please log in or sign up to begin your journey.</p>
        
        <form id="auth-form">
            <input type="email" placeholder="Email Address" required>
            <input type="password" placeholder="Password" required>
            
            <button type="submit" class="nav-button" onclick="redirectToAssessment(event)">Continue to Assessment</button>
        </form>
    </main>

    <script src="app.js"></script>

</body>
</html>
